<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoAI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0d12;
    color: #f1f3f8;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px 30px;
    border-bottom: 1px solid #252936;
    font-size: 22px;
    font-weight: bold;
}

main {
    max-width: 950px;
    margin: 35px auto;
    padding: 0 18px;
}

h2 {
    font-size: 21px;
    margin-bottom: 18px;
}

.panel {
    background: #141821;
    border: 1px solid #292f3d;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 25px;
}

#chatMessages {
    height: 300px;
    overflow-y: auto;
    padding: 10px 0;
}

.message {
    background: #202633;
    padding: 12px 15px;
    border-radius: 10px;
    margin: 10px 0;
    max-width: 85%;
    line-height: 1.5;
}

.user {
    margin-left: auto;
    background: #293c5c;
}

.input-row {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    background: #0d1119;
    color: white;
    border: 1px solid #343b4a;
    border-radius: 9px;
    padding: 13px;
    font-size: 15px;
}

button {
    background: #5578c9;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 17px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #6689dc;
}

.tabs {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid #303747;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tab {
    background: transparent;
    color: #aab2c2;
    border-radius: 0;
    border-bottom: 2px solid transparent;
}

.tab.active {
    color: white;
    border-bottom: 2px solid #6689dc;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

#results {
    min-height: 120px;
    background: #0d1119;
    border: 1px solid #303747;
    border-radius: 9px;
    padding: 15px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.status {
    color: #aab2c2;
    font-size: 13px;
    margin-top: 12px;
}
</style>
</head>

<body>

<header>◈ EvoAI</header>

<main>

<!-- KI-CHAT: ERSTE SEITE -->
<section class="panel">
    <h2>KI-Chat</h2>

    <div id="chatMessages">
        <div class="message">
            Hallo! Ich bin EvoAI. Wie kann ich dir helfen?
        </div>
    </div>

    <div class="input-row">
        <input id="chatInput" placeholder="Schreibe eine Nachricht...">
        <button onclick="sendMessage()">Senden</button>
    </div>
</section>

<!-- KI-ENTWICKLUNG -->
<section class="panel">
    <h2>KI-Entwicklung</h2>

    <div class="tabs">
        <button class="tab active" onclick="showTab('entwicklung', this)">
            Entwicklung
        </button>

        <button class="tab" onclick="showTab('ergebnisse', this)">
            Ergebnisse
        </button>
    </div>

    <div id="entwicklung" class="tab-content active">
        <p>
            Hier kann EvoAI an der eigenen Weiterentwicklung arbeiten.
        </p>

        <button onclick="developAI()">
            KI selbst weiterentwickeln
        </button>

        <div class="status" id="developmentStatus">
            Bereit für eine neue Entwicklung.
        </div>
    </div>

    <div id="ergebnisse" class="tab-content">
        <p>Ergebnisse der bisherigen Entwicklungen:</p>
        <div id="results">
            Noch keine Entwicklungen vorhanden.
        </div>
    </div>
</section>

</main>

<script>
function showTab(tabName, button) {
    document.querySelectorAll(".tab-content").forEach(tab => {
        tab.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    document.getElementById(tabName).classList.add("active");
    button.classList.add("active");
}

async function sendMessage() {
    const input = document.getElementById("chatInput");
    const messages = document.getElementById("chatMessages");
    const message = input.value.trim();

    if (!message) return;

    messages.innerHTML +=
        `<div class="message user">${escapeHTML(message)}</div>`;

    input.value = "";

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message})
        });

        if (!response.ok) throw new Error();

        const data = await response.json();

        messages.innerHTML +=
            `<div class="message">${escapeHTML(data.reply || "Keine Antwort erhalten.")}</div>`;
    } catch {
        messages.innerHTML +=
            `<div class="message">Die KI-Verbindung ist noch nicht eingerichtet.</div>`;
    }

    messages.scrollTop = messages.scrollHeight;
}

async function developAI() {
    const status = document.getElementById("developmentStatus");
    const results = document.getElementById("results");

    status.textContent = "EvoAI versucht, sich weiterzuentwickeln...";

    try {
        const response = await fetch("/api/evolve", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({})
        });

        if (!response.ok) throw new Error();

        const data = await response.json();

        results.textContent =
            data.description || data.result || "Entwicklung abgeschlossen.";

        status.textContent = "Entwicklung abgeschlossen.";
        showTab("ergebnisse", document.querySelectorAll(".tab")[1]);

    } catch {
        status.textContent = "Die Entwicklungsverbindung ist noch nicht eingerichtet.";
        results.textContent =
            "Sobald die KI-Schnittstelle eingerichtet ist, erscheinen hier ihre tatsächlichen Entwicklungen.";
    }
}

function escapeHTML(text) {
    const element = document.createElement("div");
    element.textContent = text;
    return element.innerHTML;
}
</script>

</body>
</html>
